<!doctype html>
<!--
  Naukri search results — the OLDER markup.

  boards/naukri.py carries a fallback for each selector:

      div.srp-jobtuple-wrapper  ->  div.cust-job-tuple
      h2 a.title                ->  h2 a[href]
      a.comp-name               ->  .comp-dtls-wrap a[href*='jobs-careers']
      .locWdth                  ->  .loc-wrap span[title]

  Fallbacks rot silently: nothing exercises them until the primary selector
  stops matching, which is the worst possible moment to discover they were
  broken. This cassette uses ONLY the fallback shapes, so both paths stay live.
-->
<html lang="en">

  <div class="cust-job-tuple">

    <div class="comp-dtls-wrap">
      <a href="/contoso-jobs-careers-000333">Contoso Systems</a>
    </div>
    <div class="loc-wrap">
      <span title="Bengaluru">Bengaluru</span>
    </div>
    <span class="job-desc">Applied research on multimodal retrieval.</span>
    <span class="job-post-day">1 Day Ago</span>
